# nginx in the "agent" pod: /mcp/<mode> on :8080 -> http://mcp-<mode>.mcp-tool-modes/mcp (through ztunnel + waypoint)
server {
    listen 8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    location /mcp/standard   { proxy_set_header Host mcp-standard.mcp-tool-modes;   proxy_pass http://mcp-standard.mcp-tool-modes.svc.cluster.local/mcp; }
    location /mcp/search     { proxy_set_header Host mcp-search.mcp-tool-modes;     proxy_pass http://mcp-search.mcp-tool-modes.svc.cluster.local/mcp; }
    location /mcp/codesearch { proxy_set_header Host mcp-codesearch.mcp-tool-modes; proxy_pass http://mcp-codesearch.mcp-tool-modes.svc.cluster.local/mcp; }
    location /mcp/code       { proxy_set_header Host mcp-code.mcp-tool-modes;       proxy_pass http://mcp-code.mcp-tool-modes.svc.cluster.local/mcp; }
}
